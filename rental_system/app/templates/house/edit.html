{% extends "base.html" %}

{% block title %}编辑房源 - 房屋租赁系统{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> 编辑房源</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('house.edit', id=house.id) }}" id="houseForm">
                        <div class="mb-3">
                            <label class="form-label">房源标题 <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required
                                   value="{{ house.title }}"
                                   placeholder="例如：朝阳区三居室精装修出租">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">区域选择 <span class="text-danger">*</span></label>
                            <div class="row g-2" id="regionSelector">
                                <div class="col-md-4">
                                    <select name="province" id="provinceSelect" class="form-select" onchange="loadCities(this.value)" required>
                                        <option value="">选择省份</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select name="city" id="citySelect" class="form-select" onchange="loadDistricts(this.value)" required disabled>
                                        <option value="">选择城市</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select name="district" id="districtSelect" class="form-select" required disabled>
                                        <option value="">选择区县</option>
                                    </select>
                                </div>
                            </div>
                            <input type="hidden" name="province_code" id="provinceCode" value="{{ house.province_code or '' }}">
                            <input type="hidden" name="city_code" id="cityCode" value="{{ house.city_code or '' }}">
                            <input type="hidden" name="district_code" id="districtCode" value="{{ house.district_code or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">详细地址 <span class="text-danger">*</span></label>
                            <input type="text" name="address" class="form-control" required
                                   value="{{ house.address }}"
                                   placeholder="小区名称、楼号、单元号等">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">房屋类型</label>
                                <select name="type" class="form-select">
                                    <option value="">请选择</option>
                                    <option value="公寓" {% if house.type == '公寓' %}selected{% endif %}>公寓</option>
                                    <option value="住宅" {% if house.type == '住宅' %}selected{% endif %}>住宅</option>
                                    <option value="别墅" {% if house.type == '别墅' %}selected{% endif %}>别墅</option>
                                    <option value="loft" {% if house.type == 'loft' %}selected{% endif %}>Loft</option>
                                    <option value="平房" {% if house.type == '平房' %}selected{% endif %}>平房</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">户型 <span class="text-danger">*</span></label>
                                <select name="room_count" class="form-select" required>
                                    <option value="">请选择</option>
                                    <option value="1室0厅" {% if house.room_count == '1室0厅' %}selected{% endif %}>1室0厅</option>
                                    <option value="1室1厅" {% if house.room_count == '1室1厅' %}selected{% endif %}>1室1厅</option>
                                    <option value="2室1厅" {% if house.room_count == '2室1厅' %}selected{% endif %}>2室1厅</option>
                                    <option value="2室2厅" {% if house.room_count == '2室2厅' %}selected{% endif %}>2室2厅</option>
                                    <option value="3室1厅" {% if house.room_count == '3室1厅' %}selected{% endif %}>3室1厅</option>
                                    <option value="3室2厅" {% if house.room_count == '3室2厅' %}selected{% endif %}>3室2厅</option>
                                    <option value="4室1厅" {% if house.room_count == '4室1厅' %}selected{% endif %}>4室1厅</option>
                                    <option value="4室2厅" {% if house.room_count == '4室2厅' %}selected{% endif %}>4室2厅</option>
                                    <option value="5室及以上" {% if house.room_count == '5室及以上' %}selected{% endif %}>5室及以上</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">面积（平方米）</label>
                                <input type="number" name="size" class="form-control" min="0"
                                       value="{{ house.size or '' }}"
                                       placeholder="例如：85">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">装修情况</label>
                                <select name="decoration" class="form-select">
                                    <option value="">请选择</option>
                                    <option value="精装" {% if house.decoration == '精装' %}selected{% endif %}>精装</option>
                                    <option value="简装" {% if house.decoration == '简装' %}selected{% endif %}>简装</option>
                                    <option value="毛坯" {% if house.decoration == '毛坯' %}selected{% endif %}>毛坯</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">租金（元/月） <span class="text-danger">*</span></label>
                                <input type="number" name="rent_price" class="form-control" required min="0"
                                       value="{{ house.rent_price }}"
                                       placeholder="例如：5000">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">押金（元）</label>
                                <input type="number" name="deposit" class="form-control" min="0"
                                       value="{{ house.deposit }}"
                                       placeholder="例如：10000">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">房源状态</label>
                            <select name="status" class="form-select" {% if house.status == 'rented' %}disabled{% endif %}>
                                {% if house.status == 'rented' %}
                                <option value="rented" selected>已租（不可修改）</option>
                                {% else %}
                                <option value="available" {% if house.status == 'available' %}selected{% endif %}>可租</option>
                                <option value="maintenance" {% if house.status == 'maintenance' %}selected{% endif %}>维护中</option>
                                {% endif %}
                            </select>
                            {% if house.status == 'rented' %}
                            <small class="text-muted">房源已租出，状态不可修改。如需更改状态，请先终止相关租赁合同。</small>
                            {% else %}
                            <small class="text-muted">可在"可租"和"维护中"之间切换状态</small>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">房源描述</label>
                            <textarea name="description" class="form-control" rows="4"
                                      placeholder="描述房屋的特色、配套设施、交通情况等">{{ house.description or '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> 保存修改
                            </button>
                            <a href="{{ url_for('user.house_detail', id=house.id) }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let regionsData = {
    provinces: {},
    cities: {},
    districts: {}
};

// 从隐藏字段获取当前选中的值
const currentProvinceCode = document.getElementById('provinceCode').value;
const currentCityCode = document.getElementById('cityCode').value;
const currentDistrictCode = document.getElementById('districtCode').value;

async function loadProvinces() {
    try {
        const response = await fetch('/api/regions/provinces');
        const data = await response.json();
        const select = document.getElementById('provinceSelect');
        select.innerHTML = '<option value="">选择省份</option>';
        data.forEach(p => {
            select.innerHTML += `<option value="${p.code}">${p.name}</option>`;
            regionsData.provinces[p.code] = p;
        });
        
        // 恢复之前选择的省份
        if (currentProvinceCode) {
            select.value = currentProvinceCode;
            await loadCities(currentProvinceCode);
        }
    } catch (error) {
        console.error('加载省份失败:', error);
        alert('加载省份数据失败，请刷新页面重试');
    }
}

async function loadCities(provinceCode) {
    const citySelect = document.getElementById('citySelect');
    const districtSelect = document.getElementById('districtSelect');

    if (!provinceCode) {
        citySelect.innerHTML = '<option value="">选择城市</option>';
        citySelect.disabled = true;
        districtSelect.innerHTML = '<option value="">选择区县</option>';
        districtSelect.disabled = true;
        return;
    }

    try {
        const response = await fetch(`/api/regions/${provinceCode}/cities`);
        const data = await response.json();
        citySelect.innerHTML = '<option value="">选择城市</option>';
        data.forEach(c => {
            citySelect.innerHTML += `<option value="${c.code}">${c.name}</option>`;
            regionsData.cities[c.code] = c;
        });
        citySelect.disabled = false;
        districtSelect.innerHTML = '<option value="">选择区县</option>';
        districtSelect.disabled = true;

        // 恢复之前选择的城市
        if (currentCityCode) {
            citySelect.value = currentCityCode;
            await loadDistricts(currentCityCode);
        }
    } catch (error) {
        console.error('加载城市失败:', error);
        alert('加载城市数据失败');
    }
}

async function loadDistricts(cityCode) {
    const districtSelect = document.getElementById('districtSelect');

    if (!cityCode) {
        districtSelect.innerHTML = '<option value="">选择区县</option>';
        districtSelect.disabled = true;
        return;
    }

    try {
        const response = await fetch(`/api/regions/${cityCode}/districts`);
        const data = await response.json();
        districtSelect.innerHTML = '<option value="">选择区县</option>';
        data.forEach(d => {
            districtSelect.innerHTML += `<option value="${d.code}">${d.name}</option>`;
            regionsData.districts[d.code] = d;
        });
        districtSelect.disabled = false;

        // 恢复之前选择的区县
        if (currentDistrictCode) {
            districtSelect.value = currentDistrictCode;
        }
    } catch (error) {
        console.error('加载区县失败:', error);
        alert('加载区县数据失败');
    }
}

document.getElementById('houseForm').addEventListener('submit', function(e) {
    const province = document.getElementById('provinceSelect').value;
    const city = document.getElementById('citySelect').value;
    const district = document.getElementById('districtSelect').value;

    if (!province) {
        e.preventDefault();
        alert('请选择省份');
        return false;
    }

    if (!city) {
        e.preventDefault();
        alert('请选择城市');
        return false;
    }

    if (!district) {
        e.preventDefault();
        alert('请选择区县');
        return false;
    }

    return true;
});

document.addEventListener('DOMContentLoaded', function() {
    loadProvinces();
});
</script>
{% endblock %}
